        d="M27.07 8.81A13.2 13.2 0 1 0 27.07 23.19L23.38 20.79A8.8 8.8 0 1 1 23.38 11.21Z" />
  <circle cx="16" cy="16" r="3.3" fill="#e8a33d" />
</svg>
