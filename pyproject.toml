[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "athenacore"
version = "0.2.0"
description = "A multi-agent collaboration engine with persistent, searchable, self-compacting memory."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Abdur Rafay" }]
keywords = [
    "multi-agent",
    "agents",
    "llm",
    "memory",
    "orchestration",
    "rag",
    "ollama",
    "debate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# The core engine is intentionally dependency-free: it runs on the standard
# library alone (sqlite3, urllib, dataclasses). Everything else is an extra.
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
ui = ["streamlit>=1.32"]
search = ["duckduckgo-search>=6.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
all = [
    "athenacore[api,ui,search,dev]",
]

[project.scripts]
athenacore = "athenacore.cli:main"

[project.urls]
Homepage = "https://github.com/Abdur-Rafay-AR/athenacore-multiagent"
Repository = "https://github.com/Abdur-Rafay-AR/athenacore-multiagent"
Issues = "https://github.com/Abdur-Rafay-AR/athenacore-multiagent/issues"
Changelog = "https://github.com/Abdur-Rafay-AR/athenacore-multiagent/blob/main/CHANGELOG.md"

[project.entry-points."athenacore.agents"]
# Third-party packages can register agents under this entry-point group and
# they become available to the CLI, API and UI with no code changes here.

[tool.hatch.build.targets.wheel]
packages = ["src/athenacore"]

[tool.hatch.build.targets.sdist]
include = ["src/athenacore", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: tests that hit a real model or the network",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/athenacore"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
